<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusDeals - Curated Products</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; color: #333; }
        header { background: #333; color: #fff; padding: 1rem; text-align: center; }
        nav { background: #444; color: #fff; padding: 0.5rem; text-align: center; }
        nav a { color: #fff; margin: 0 1rem; text-decoration: none; }
        .container { padding: 2rem; max-width: 1200px; margin: auto; }
        .products { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }
        .product-card { border: 1px solid #ddd; border-radius: 8px; width: 300px; padding: 1rem; text-align: center; }
        .product-card img { max-width: 100%; border-radius: 8px; }
        .product-card h3 { margin: 1rem 0 0.5rem; }
        .product-card p { color: #666; }
        .btn { display: inline-block; background: #28a745; color: #fff; padding: 0.75rem 1.5rem; border-radius: 5px; text-decoration: none; margin-top: 1rem; }
        footer { background: #333; color: #fff; text-align: center; padding: 1rem; position: fixed; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <header>
        <h1>NexusDeals</h1>
    </header>
    <div class="container">
        <h2>Top Deals</h2>
        <div class="products">
            <div class="product-card">
                <h3>Product 1</h3>
                <p>Short description of this amazing product.</p>
                <a href="#" class="btn">View Deal</a>
            </div>
            <div class="product-card">
                <h3>Product 2</h3>
                <p>Another great deal you don't want to miss.</p>
                <a href="#" class="btn">View Deal</a>
            </div>
            <div class="product-card">
                <h3>Product 3</h3>
                <p>Perfect item for your daily needs.</p>
                <a href="#" class="btn">View Deal</a>
            </div>
        </div>
    </div>
</body>
</html>
